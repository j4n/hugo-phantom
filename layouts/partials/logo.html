            <!-- Header -->
            <header id="header">
                <div class="inner">
                    <!-- Logo -->
                    <a href="/" class="logo">
                        <!-- <span class="symbol"><img src="/images/logo.svg" alt="" /></span> -->
                        <span class="title">
                            {{ .Site.Title }}
                        {{- if .IsHome -}}
                            &nbsp;-&nbsp; Home
                        {{- else if .IsSection -}}
                            &nbsp;-&nbsp; {{- .Section -}}
                        {{- else if .IsPage -}}
                            {{- if .Section -}}
                                &nbsp;-&nbsp; {{- .Section -}}
                            {{- end -}}
                            &nbsp;-&nbsp; {{- .Title -}}
                        {{ end }}
                        </span>
                    </a>

                    <!-- Nav -->
                    <nav>
                        <ul>
                            <li><a href="#menu">Menu</a></li>
                        </ul>
                    </nav>
                </div>
            </header>
